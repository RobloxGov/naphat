<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📚 Focus Tracker · เรียนเริ่ส</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-body);
            padding: 1.5rem;
        }

        /* ---------- THEME VARIABLES ---------- */
        :root {
            --bg-body: #f4f1ec;
            --bg-card: #ffffffd9;
            --bg-card-solid: #ffffff;
            --text-primary: #1e1e2a;
            --text-secondary: #4a4a5a;
            --accent: #b68b6b;
            --accent-glow: rgba(182, 139, 107, 0.25);
            --border-light: rgba(0, 0, 0, 0.06);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.06), 0 8px 20px rgba(0, 0, 0, 0.03);
            --glass: rgba(255, 255, 255, 0.5);
            --timer-color: #2c2c3a;
            --btn-bg: #1e1e2a;
            --btn-text: #faf8f5;
            --icon-color: #5a5a6e;
            --input-bg: rgba(255, 255, 255, 0.6);
            --chart-grid: rgba(0, 0, 0, 0.06);
            --badge-bg: rgba(255, 255, 255, 0.5);
        }

        [data-theme="dark"] {
            --bg-body: #12121a;
            --bg-card: #1e1e2cd9;
            --bg-card-solid: #1e1e2c;
            --text-primary: #ececf0;
            --text-secondary: #b0b0c0;
            --accent: #d9b89c;
            --accent-glow: rgba(217, 184, 156, 0.2);
            --border-light: rgba(255, 255, 255, 0.06);
            --shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            --glass: rgba(30, 30, 44, 0.5);
            --timer-color: #f0eade;
            --btn-bg: #ececf0;
            --btn-text: #1e1e2a;
            --icon-color: #b0b0c0;
            --input-bg: rgba(40, 40, 60, 0.6);
            --chart-grid: rgba(255, 255, 255, 0.08);
            --badge-bg: rgba(40, 40, 60, 0.5);
        }

        /* ---------- LAYOUT ---------- */
        .app-wrapper {
            max-width: 1100px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 1.8rem;
        }

        .timer-card {
            width: 100%;
            padding: 2.2rem 2rem 2rem;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 48px;
            box-shadow: var(--shadow), 0 0 0 1px var(--border-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 1.8rem;
        }

        @media (max-width: 780px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .dash-card {
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 1.6rem 1.5rem 1.8rem;
            box-shadow: var(--shadow), 0 0 0 1px var(--border-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .dash-card h3 {
            font-size: 1.1rem;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dash-card h3 i {
            color: var(--accent);
        }

        /* ---------- CARD HEADER ---------- */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
        }

        .card-header h2 {
            font-size: 1.3rem;
            font-weight: 500;
            letter-spacing: -0.3px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-header h2 i {
            color: var(--accent);
            font-size: 1.5rem;
        }

        .theme-toggle {
            background: var(--glass);
            backdrop-filter: blur(4px);
            border: 1px solid var(--border-light);
            border-radius: 60px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .theme-toggle:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
            box-shadow: 0 0 20px var(--accent-glow);
        }

        /* ---------- INPUTS ---------- */
        .subject-area {
            margin-bottom: 1.5rem;
        }
        .subject-input {
            width: 100%;
            padding: 0.8rem 1.5rem;
            border-radius: 60px;
            border: 1px solid var(--border-light);
            background: var(--input-bg);
            backdrop-filter: blur(4px);
            font-size: 1.05rem;
            font-weight: 450;
            color: var(--text-primary);
            text-align: center;
            outline: none;
            transition: 0.25s ease;
        }
        .subject-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        .timer-display {
            font-size: 4.6rem;
            font-weight: 600;
            letter-spacing: 5px;
            color: var(--timer-color);
            background: var(--glass);
            backdrop-filter: blur(6px);
            padding: 0.5rem 0.2rem;
            margin: 0.2rem 0 1.2rem;
            border-radius: 80px;
            border: 1px solid var(--border-light);
            font-variant-numeric: tabular-nums;
        }

        /* ---------- BUTTONS ---------- */
        .action-group {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
            margin: 1.2rem 0 0.8rem;
        }

        .btn {
            border: none;
            background: var(--btn-bg);
            color: var(--btn-text);
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid transparent;
            flex: 1 1 auto;
            min-width: 100px;
            backdrop-filter: blur(4px);
        }

        .btn-primary {
            background: var(--accent);
            color: #1e1e2a;
            box-shadow: 0 8px 24px var(--accent-glow);
            border-color: var(--accent);
        }
        .btn-primary:hover {
            transform: scale(1.02);
            filter: brightness(1.04);
        }
        .btn-secondary {
            background: var(--glass);
            color: var(--text-primary);
            border: 1px solid var(--border-light);
        }
        .btn-secondary:hover {
            background: var(--accent);
            color: #1e1e2a;
            border-color: var(--accent);
        }
        .btn-reset {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-light);
            flex: 0.5;
            min-width: 60px;
        }
        .btn-reset:hover {
            background: rgba(200, 80, 80, 0.08);
            color: #c45a5a;
            border-color: #c45a5a40;
        }
        .btn-save {
            background: #2b7a4b;
            color: white;
            border-color: #2b7a4b;
        }
        .btn-save:hover {
            background: #1f5f39;
            transform: scale(1.02);
        }
        .btn-save i {
            font-size: 1rem;
        }
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
            filter: grayscale(0.3);
        }

        .status-tag {
            margin-top: 1.2rem;
            color: var(--text-secondary);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            border-top: 1px solid var(--border-light);
            padding-top: 1.2rem;
        }
        .subject-badge {
            background: var(--badge-bg);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .subject-badge i {
            margin-right: 6px;
            color: var(--accent);
        }

        /* ---------- DASHBOARD TABLE ---------- */
        .progress-table-wrap {
            max-height: 240px;
            overflow-y: auto;
            border-radius: 20px;
            scrollbar-width: thin;
            scrollbar-color: var(--accent) transparent;
        }
        .progress-table-wrap::-webkit-scrollbar {
            width: 4px;
        }
        .progress-table-wrap::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 12px;
        }

        .progress-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
            color: var(--text-primary);
        }
        .progress-table th {
            text-align: left;
            padding: 0.6rem 0.4rem 0.6rem 0;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border-light);
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .progress-table td {
            padding: 0.55rem 0.4rem 0.55rem 0;
            border-bottom: 1px solid var(--border-light);
        }
        .progress-table tr:last-child td {
            border-bottom: none;
        }
        .hours-badge {
            background: var(--accent-glow);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            font-weight: 500;
            color: var(--accent);
            font-size: 0.8rem;
        }
        .empty-msg {
            color: var(--text-secondary);
            opacity: 0.6;
            padding: 0.8rem 0;
            font-style: italic;
        }

        /* chart container */
        .chart-container {
            position: relative;
            height: 200px;
            width: 100%;
            margin-top: 0.2rem;
        }

        /* notification */
        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card-solid);
            backdrop-filter: blur(12px);
            padding: 0.8rem 2rem;
            border-radius: 60px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            font-weight: 450;
            z-index: 999;
            opacity: 0;
            transition: opacity 0.4s ease, bottom 0.4s ease;
            pointer-events: none;
            font-size: 0.95rem;
        }
        .toast-msg.show {
            opacity: 1;
            bottom: 40px;
        }

        @media (max-width: 480px) {
            .timer-card {
                padding: 1.5rem 1rem;
            }
            .timer-display {
                font-size: 3.2rem;
            }
            .btn {
                font-size: 0.9rem;
                padding: 0.6rem 1.2rem;
                min-width: 70px;
            }
            .dash-card {
                padding: 1.2rem 1rem;
            }
            .dashboard-grid {
                gap: 1.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <!-- TIMER CARD -->
        <div class="timer-card">
            <div class="card-header">
                <h2><i class="fas fa-book-open"></i> <span id="headerSubject">Focus</span></h2>
                <button class="theme-toggle" id="themeToggle" aria-label="เปลี่ยนโทนสี">
                    <i class="fas fa-moon" id="themeIcon"></i>
                </button>
            </div>

            <div class="subject-area">
                <input type="text" class="subject-input" id="subjectInput" placeholder="📘 ชื่อวิชาที่อ่าน ..." maxlength="40" value="Thermodynamics">
            </div>

            <div class="timer-display" id="timerDisplay">00:00:00</div>

            <div class="action-group">
                <button class="btn btn-primary" id="startBtn"><i class="fas fa-play"></i> เริ่ม</button>
                <button class="btn btn-secondary" id="pauseBtn"><i class="fas fa-pause"></i> หยุด</button>
                <button class="btn btn-reset" id="resetBtn"><i class="fas fa-undo-alt"></i></button>
                <button class="btn btn-save" id="saveBtn"><i class="fas fa-cloud-upload-alt"></i> บันทึก</button>
            </div>

            <div class="status-tag">
                <i class="fas fa-clock"></i>
                <span id="statusText">⏸️ ยังไม่เริ่ม</span>
                <span class="subject-badge"><i class="fas fa-tag"></i> <span id="badgeSubject">Thermodynamics</span></span>
            </div>
        </div>

        <!-- DASHBOARD -->
        <div class="dashboard-grid">
            <!-- TABLE -->
            <div class="dash-card">
                <h3><i class="fas fa-table"></i> ความคืบหน้ารายวิชา</h3>
                <div class="progress-table-wrap">
                    <table class="progress-table" id="progressTable">
                        <thead>
                            <tr><th>วิชา</th><th style="text-align:right;">ชั่วโมง</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <tr><td colspan="2" class="empty-msg">ยังไม่มีข้อมูล</td></tr>
                        </tbody>
                    </table>
                </div>
                <div style="margin-top: 0.8rem; font-size:0.8rem; color:var(--text-secondary); opacity:0.6; display:flex; gap:12px; flex-wrap:wrap;">
                    <span><i class="fas fa-database"></i> <span id="totalHoursDisplay">0</span> ชม.</span>
                    <span><i class="fas fa-book"></i> <span id="subjectCountDisplay">0</span> วิชา</span>
                </div>
            </div>

            <!-- CHART -->
            <div class="dash-card">
                <h3><i class="fas fa-chart-bar"></i> กราฟชั่วโมงสะสม</h3>
                <div class="chart-container">
                    <canvas id="progressChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toastMsg" class="toast-msg">✅ บันทึกเรียบร้อย</div>

    <script>
        (function() {
            'use strict';

            // -------------------- DOM --------------------
            const timerDisplay = document.getElementById('timerDisplay');
            const startBtn = document.getElementById('startBtn');
            const pauseBtn = document.getElementById('pauseBtn');
            const resetBtn = document.getElementById('resetBtn');
            const saveBtn = document.getElementById('saveBtn');
            const subjectInput = document.getElementById('subjectInput');
            const badgeSubject = document.getElementById('badgeSubject');
            const headerSubject = document.getElementById('headerSubject');
            const statusText = document.getElementById('statusText');
            const themeToggle = document.getElementById('themeToggle');
            const themeIcon = document.getElementById('themeIcon');
            const tableBody = document.getElementById('tableBody');
            const totalHoursDisplay = document.getElementById('totalHoursDisplay');
            const subjectCountDisplay = document.getElementById('subjectCountDisplay');
            const toast = document.getElementById('toastMsg');

            // -------------------- STATE --------------------
            let timerInterval = null;
            let seconds = 0;
            let isRunning = false;
            let isPaused = false;
            let currentTheme = 'light';

            // ข้อมูลจาก GG (จำลอง)
            let subjectData = {}; // { "คณิตศาสตร์": 2.5, "ฟิสิกส์": 1.2 }

            // Chart instance
            let chartInstance = null;

            // -------------------- GG SHEET CONFIG --------------------
            // ใช้ Google Apps Script Web App URL (เปลี่ยนเป็น URL ของคุณ)
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzBP843GELq4xldrzR40OuJbra80PhBU7gprMyQcuQEgbVZq_MBQwraVMDqYFjg5K6t/exec';

            // -------------------- HELPERS --------------------
            function formatTime(sec) {
                const hrs = Math.floor(sec / 3600);
                const mins = Math.floor((sec % 3600) / 60);
                const secs = sec % 60;
                return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            }

            function secondsToHours(sec) {
                return Math.round((sec / 3600) * 100) / 100;
            }

            function updateTimerDisplay() {
                timerDisplay.textContent = formatTime(seconds);
            }

            function updateSubjectUI() {
                const val = subjectInput.value.trim() || 'ไม่ระบุวิชา';
                badgeSubject.textContent = val;
                headerSubject.textContent = val;
            }

            function setStatusText(text) {
                statusText.textContent = text;
            }

            function showToast(msg, isError = false) {
                toast.textContent = msg;
                toast.style.background = isError ? '#c45a5a' : 'var(--bg-card-solid)';
                toast.style.color = isError ? '#fff' : 'var(--text-primary)';
                toast.classList.add('show');
                clearTimeout(toast._hide);
                toast._hide = setTimeout(() => toast.classList.remove('show'), 2800);
            }

            // -------------------- STOP TIMER --------------------
            function stopTimer() {
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isRunning = false;
                isPaused = false;
            }

            // -------------------- TIMER CONTROLS --------------------
            function startCount() {
                if (isRunning && !isPaused) return;
                if (isPaused) {
                    isPaused = false;
                    isRunning = true;
                    timerInterval = setInterval(() => { seconds++;
                        updateTimerDisplay(); }, 1000);
                    setStatusText('▶️ กำลังอ่าน...');
                    return;
                }
                if (timerInterval) clearInterval(timerInterval);
                isRunning = true;
                isPaused = false;
                timerInterval = setInterval(() => { seconds++;
                    updateTimerDisplay(); }, 1000);
                setStatusText('▶️ กำลังอ่าน...');
            }

            function pauseCount() {
                if (!isRunning || isPaused) return;
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isPaused = true;
                setStatusText('⏸️ หยุดชั่วคราว');
            }

            function resetCount() {
                stopTimer();
                seconds = 0;
                updateTimerDisplay();
                isRunning = false;
                isPaused = false;
                setStatusText('⏹️ รีเซ็ตแล้ว');
                if (seconds === 0) setStatusText('⏸️ ยังไม่เริ่ม');
            }

            // -------------------- GOOGLE SHEET : PULL (GET) --------------------
            async function fetchFromSheet() {
                try {
                    const res = await fetch(SCRIPT_URL, { method: 'GET' });
                    if (!res.ok) throw new Error('Network error');
                    const data = await res.json();
                    if (data && data.data) {
                        subjectData = data.data;
                    } else {
                        // ถ้าไม่มี data ให้ใช้ mock
                        subjectData = { 'คณิตศาสตร์': 2.5, 'ฟิสิกส์': 1.2, 'เคมี': 0.8 };
                    }
                    renderTableAndChart();
                } catch (err) {
                    console.warn('ใช้ข้อมูลจำลอง (ไม่สามารถดึงจาก GG)', err);
                    subjectData = { 'คณิตศาสตร์': 2.5, 'ฟิสิกส์': 1.2, 'เคมี': 0.8 };
                    renderTableAndChart();
                    showToast('⚠️ ใช้ข้อมูลจำลอง (ไม่เชื่อม GG)', true);
                }
            }

            // -------------------- GOOGLE SHEET : PUSH (POST) --------------------
            async function pushToSheet(subject, hours) {
                try {
                    const payload = { subject, hours };
                    const res = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        mode: 'no-cors', // ใช้ no-cors เพื่อหลีกเลี่ยง CORS (แต่ต้องปรับฝั่ง Apps Script)
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    // ด้วย no-cors response จะเป็น opaque ไม่สามารถอ่านได้
                    // แต่เราถือว่าสำเร็จ และทำการ refresh ข้อมูล
                    showToast('✅ บันทึกสำเร็จ! (โหลดข้อมูลใหม่)');
                    // ดึงข้อมูลล่าสุด
                    await fetchFromSheet();
                } catch (err) {
                    console.error('Push error:', err);
                    showToast('❌ บันทึกไม่สำเร็จ', true);
                }
            }

            // -------------------- RENDER TABLE & CHART --------------------
            function renderTableAndChart() {
                // table
                const entries = Object.entries(subjectData);
                if (entries.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="2" class="empty-msg">ยังไม่มีข้อมูล</td></tr>`;
                    totalHoursDisplay.textContent = '0';
                    subjectCountDisplay.textContent = '0';
                } else {
                    let html = '';
                    let total = 0;
                    entries.forEach(([name, hrs]) => {
                        total += hrs;
                        html += `<tr><td>${name}</td><td style="text-align:right;"><span class="hours-badge">${hrs.toFixed(2)} ชม.</span></td></tr>`;
                    });
                    tableBody.innerHTML = html;
                    totalHoursDisplay.textContent = total.toFixed(2);
                    subjectCountDisplay.textContent = entries.length;
                }

                // chart
                updateChart(entries);
            }

            // -------------------- CHART.JS --------------------
            function updateChart(entries) {
                const ctx = document.getElementById('progressChart').getContext('2d');
                const labels = entries.map(e => e[0]);
                const data = entries.map(e => e[1]);

                if (chartInstance) {
                    chartInstance.destroy();
                }

                if (entries.length === 0) {
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: { labels: ['ไม่มีข้อมูล'], datasets: [{ label: 'ชั่วโมง', data: [0], backgroundColor: 'var(--accent)',
                                borderRadius: 8 }] },
                        options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
                    });
                    return;
                }

                chartInstance = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'ชั่วโมงสะสม',
                            data: data,
                            backgroundColor: 'var(--accent)',
                            borderRadius: 8,
                            barPercentage: 0.6,
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { display: false },
                        },
                        scales: {
                            y: {
                                beginAtZero: true,
                                grid: { color: 'var(--chart-grid)' },
                                ticks: { color: 'var(--text-secondary)' }
                            },
                            x: {
                                grid: { display: false },
                                ticks: { color: 'var(--text-secondary)', maxRotation: 20 }
                            }
                        }
                    }
                });
            }

            // -------------------- SAVE (บันทึก) --------------------
            async function handleSave() {
                const subject = subjectInput.value.trim() || 'ไม่ระบุวิชา';
                if (seconds === 0) {
                    showToast('⚠️ ยังไม่มีเวลาให้บันทึก', true);
                    return;
                }
                const hours = secondsToHours(seconds);
                // บันทึกไป GG
                await pushToSheet(subject, hours);
                // หลังจาก push แล้ว fetch ใหม่ (ใน pushToSheet เรียก fetch แล้ว)
                // reset เวลา หลังจากบันทึก
                resetCount();
                // โหลดข้อมูลใหม่ (fetchFromSheet ถูกเรียกใน pushToSheet แล้ว)
            }

            // -------------------- THEME --------------------
            function toggleTheme() {
                const html = document.documentElement;
                if (currentTheme === 'light') {
                    html.setAttribute('data-theme', 'dark');
                    themeIcon.className = 'fas fa-sun';
                    currentTheme = 'dark';
                } else {
                    html.removeAttribute('data-theme');
                    themeIcon.className = 'fas fa-moon';
                    currentTheme = 'light';
                }
                // re-render chart เพื่อให้สีเปลี่ยน (ต้องทำใหม่)
                const entries = Object.entries(subjectData);
                updateChart(entries);
            }

            // -------------------- INIT --------------------
            async function init() {
                // ตั้งค่าเริ่มต้น
                updateSubjectUI();
                updateTimerDisplay();
                setStatusText('⏸️ ยังไม่เริ่ม');
                themeIcon.className = 'fas fa-moon';
                currentTheme = 'light';

                // โหลดข้อมูลจาก GG
                await fetchFromSheet();

                // Event listeners
                startBtn.addEventListener('click', startCount);
                pauseBtn.addEventListener('click', pauseCount);
                resetBtn.addEventListener('click', resetCount);
                saveBtn.addEventListener('click', handleSave);
                subjectInput.addEventListener('input', updateSubjectUI);
                themeToggle.addEventListener('click', toggleTheme);

                // กด Enter ใน input ให้ focus ที่ปุ่ม start
                subjectInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') startBtn.click();
                });

                // cleanup
                window.addEventListener('beforeunload', () => {
                    if (timerInterval) clearInterval(timerInterval);
                });
            }

            init();

        })();
    </script>

</body>
</html>
